pluginManagement {
    repositories {
        def mirror = providers.gradleProperty('androidMavenMirror').orNull
        mavenCentral()
        if (mirror) {
            maven { url = uri(mirror) }
        } else {
            google()
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def mirror = providers.gradleProperty('androidMavenMirror').orNull
        mavenCentral()
        if (mirror) {
            maven { url = uri(mirror) }
        } else {
            google()
        }
    }
}

rootProject.name = 'WarframeMobileAssistant'
include ':app'
